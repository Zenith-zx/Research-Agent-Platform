spring:
  application:
    name: earnings-monitor
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/earnings?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:earnings}
    password: ${DB_PASSWORD:earnings}
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:zhouxin.hzau.hust@gmail.com}
    password: ${MAIL_PASSWORD:zhouxin123}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

earnings:
  simulation:
    enabled: ${EARNINGS_SIMULATION_ENABLED:false}
  monitor:
    enabled: ${EARNINGS_MONITOR_ENABLED:true}
    interval-seconds: ${EARNINGS_MONITOR_INTERVAL_SECONDS:30}
  sec:
    base-url: https://www.sec.gov
    data-base-url: https://data.sec.gov
    user-agent: ${SEC_USER_AGENT:self-investor/0.1 zhouxin.hzau.hust@gmail.com}
    connect-timeout: 5s
    read-timeout: 30s
    min-request-interval: 120ms
  openai:
    base-url: https://api.openai.com
    api-key: ${OPENAI_API_KEY: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}
    model: ${OPENAI_MODEL:GPT-5.6-Sol}
    max-input-chars: ${OPENAI_MAX_INPUT_CHARS:60000}
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}

logging:
  level:
    com.selfinvestor.earnings: INFO

market-stress:
  enabled: ${MARKET_STRESS_ENABLED:false}
  symbols: ${MARKET_STRESS_SYMBOLS:QQQ}
  rsi-period: ${MARKET_STRESS_RSI_PERIOD:6}
  rsi-trigger: ${MARKET_STRESS_RSI_TRIGGER:30}
  analysis-cooldown-hours: ${MARKET_STRESS_COOLDOWN_HOURS:12}
  scheduler:
    enabled: ${MARKET_STRESS_SCHEDULER_ENABLED:true}
    interval-minutes: ${MARKET_STRESS_INTERVAL_MINUTES:60}
    market-hours-only: ${MARKET_STRESS_MARKET_HOURS_ONLY:true}
  provider:
    market-data: ${MARKET_STRESS_MARKET_DATA_PROVIDER:ibkr}
    base-url: ${ALPHA_VANTAGE_BASE_URL:https://www.alphavantage.co}
    api-key: ${ALPHA_VANTAGE_API_KEY:}
    connect-timeout: 5s
    read-timeout: 30s
    news-lookback-hours: ${MARKET_STRESS_NEWS_LOOKBACK_HOURS:72}
    max-news-articles: ${MARKET_STRESS_MAX_NEWS_ARTICLES:30}
    ibkr:
      base-url: ${IBKR_CLIENT_PORTAL_BASE_URL:https://localhost:5000/v1/api}
      connect-timeout: ${IBKR_CONNECT_TIMEOUT:5s}
      read-timeout: ${IBKR_READ_TIMEOUT:30s}
      verify-ssl: ${IBKR_VERIFY_SSL:false}
      require-realtime: ${IBKR_REQUIRE_REALTIME:true}
      snapshot-preflight-delay: ${IBKR_SNAPSHOT_PREFLIGHT_DELAY:500ms}
      compete-session: ${IBKR_COMPETE_SESSION:false}
  scoring:
    technical-oversold-weight: ${MARKET_STRESS_WEIGHT_TECHNICAL:20}
    event-reversibility-weight: ${MARKET_STRESS_WEIGHT_REVERSIBILITY:20}
    fundamental-damage-weight: ${MARKET_STRESS_WEIGHT_FUNDAMENTAL:15}
    financial-stress-weight: ${MARKET_STRESS_WEIGHT_FINANCIAL_STRESS:15}
    bad-news-pricing-weight: ${MARKET_STRESS_WEIGHT_PRICING:20}
    seller-exhaustion-weight: ${MARKET_STRESS_WEIGHT_EXHAUSTION:10}
  email:
    enabled: ${MARKET_STRESS_EMAIL_ENABLED:false}
    recipients: ${MARKET_STRESS_EMAIL_RECIPIENTS:zhouxin.hzau.hust@gmail.com}
