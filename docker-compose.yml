services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: earnings
      MYSQL_USER: earnings
      MYSQL_PASSWORD: earnings
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - earnings_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  earnings_mysql:
